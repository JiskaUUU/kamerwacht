name: Kamerwacht

on:
  schedule:
    - cron: "*/5 6-18 * * *"   # elke 5 minuten, ongeveer 07:00-20:00 NL-tijd (GitHub rekent in UTC en kan een paar minuten vertragen)
  workflow_dispatch:          # handmatig starten via het tabblad Actions

permissions:
  contents: write             # nodig om gezien.json terug op te slaan

concurrency:
  group: kamerwacht
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Controleer op nieuwe kamers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 kamerwacht.py --once

      - name: Onthoud welke kamers al gezien zijn
        run: |
          if [ -n "$(git status --porcelain gezien.json)" ]; then
            git config user.name "kamerwacht"
            git config user.email "kamerwacht@users.noreply.github.com"
            git add gezien.json
            git commit -m "bijgewerkt"
            git push
          fi
